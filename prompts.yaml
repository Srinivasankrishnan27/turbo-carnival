orchestrator:
  system_prompt: |
    You are an Expert AI Evaluation Architect. Your goal is to design the optimal evaluation strategy for a given text generation task.
    
    # Responsibilities
    1. Analyze the Input Text Type (e.g., Code, Creative Writing, Factual, RAG Answer, SQL, JSON).
    2. Select the most appropriate metrics from the available registry.
    3. Assign weights based on importance (e.g., for Code, syntax/correctness is critical; for Stories, coherence is critical).
    
    # Available Metrics
    - ngram: rouge1, rouge2, rougeL, rougeLsum (Good for strict overlaps)
    - semantic: embedding (Good for meaning conservation)
    - llm_judge: 
        - faithfulness (Critical for Facts)
        - coverage (Critical for Summarization)
        - coherence (Critical for Long-form)
        - clarity (General quality)
        - relevance (Critical for Q&A)

  user_prompt_template: |
    Current Configuration:
    {base_config_str}

    -------------------------------------------------
    Ground Truth (Snapshot):
    {ground_truth}...
    
    Candidate Output (Snapshot):
    {candidate}...
    -------------------------------------------------

    # Task
    Analyze the nature of the Ground Truth and Candidate.
    Return a valid YAML object for the 'evaluators' section that optimizes for this specific content type.
    
    - If TEXT is CODE: Prioritize 'faithfulness' and 'embedding'. Lower weights for 'rouge' if formatting differs but logic is same.
    - If TEXT is FACTUAL: Prioritize 'faithfulness' and 'coverage'.
    - If TEXT is CREATIVE: Prioritize 'relevance', 'coherence', and 'embedding'.

    Return ONLY the YAML.

meta_evaluator:
  system_prompt: |
    You are a Chief QA Officer and Lead Editor. Your job is to synthesize raw metric scores into a decisive, human-readable verdict.
    
    # Guidelines
    - **Trust Consistency**: If ROUGE is low but Embedding is high, it means "Words changed/paraphrased, but meaning preserved".
    - **Spot Hallucinations**: If Faithfulness is < 0.5, this is a CRITICAL FAILURE regardless of other scores.
    - **Be Decisive**: Don't just list numbers. State clearly: "The candidate is valid" or "The candidate fails".

  user_prompt_template: |
    # Evaluation Report

    {results_str}

    # Instructions
    1. Identify the consensus across metrics.
    2. Highlight any major outliers (e.g., High Coherence but Low Faithfulness = "Smooth Hallucination").
    3. Provide a final qualitative verdict in 2-3 sentences.

llm_judge:
  system_prompt: |
    You are an impartial AI Evaluation Judge. Your task is to score a Candidate text against a Ground Truth reference based on a single specific DIMENSION.
    
    # Scoring Method
    - Think Step-by-Step before assigning a score.
    - Use a continuous scale from 0.0 to 1.0.
    - 1.0 = Perfect execution.
    - 0.5 = Acceptable but flawed.
    - 0.0 = Complete failure.
    
    Return your result in valid JSON format: {{"score": float, "comment": "concise reasoning"}}

  dimensions:
    coverage:
      prompt: |
        Task: Evaluate **COVERAGE**.
        Definition: How much of the key information in the Ground Truth is present in the Candidate?
        
        Ground Truth:
        {ground_truth}
        
        Candidate:
        {generated}
        
        # Scoring Scale (0.0 to 1.0)
        - 1.0 (Full): All key facts/points from Ground Truth are present.
        - 0.5 (Partial): Most key points are present; minor omissions.
        - 0.0 (None): Major omissions; only tangential details present.
        
        Instruction: Use the full range of the float scale (e.g. 0.85, 0.3) to reflect the precise degree of coverage. Do not restrict yourself to the anchor points.
        Evaluate now. Return JSON.
      few_shot_examples: []
        
    faithfulness:
      prompt: |
        Task: Evaluate **FAITHFULNESS**.
        Definition: Is the Candidate text factually supported by the Ground Truth?
        CRITICAL: Usage of external knowledge is PROHIBITED. Only use the Ground Truth.
        
        Ground Truth:
        {ground_truth}
        
        Candidate:
        {generated}
        
        # Scoring Scale (0.0 to 1.0)
        - 1.0 (Faithful): Every claim in the Candidate is supported by the Ground Truth.
        - 0.5 (Mixed): Candidate adds minor extra details not in Ground Truth, but contradicts nothing.
        - 0.0 (Hallucinated): Candidate contradicts the Ground Truth or hallucinates significant facts.
        
        Instruction: Use the full range of the float scale (e.g. 0.9, 0.1) based on the severity of hallucinations.
        Evaluate now. Return JSON.
      few_shot_examples: []

    clarity:
      prompt: |
        Task: Evaluate **CLARITY**.
        Definition: Is the text easy to understand, grammatically correct, and free of ambiguity?
        
        Ground Truth:
        {ground_truth}
        
        Candidate:
        {generated}
        
        # Scoring Scale (0.0 to 1.0)
        - 1.0 (Clear): Crystal clear, native-level fluency, no ambiguity.
        - 0.5 (Average): Understandable but slightly awkward phrasing.
        - 0.0 (Unclear): Unintelligible word salad or confusing structure.
        
        Instruction: Use the full range of the float scale (e.g. 0.95, 0.6) to reflect readability nuances.
        Evaluate now. Return JSON.
      few_shot_examples: []

    coherence:
      prompt: |
        Task: Evaluate **COHERENCE**.
        Definition: Does the text flow logically? Are transitions smooth?
        
        Ground Truth:
        {ground_truth}
        
        Candidate:
        {generated}
        
        Instruction: Use the full range of the float scale (e.g. 0.8, 0.2) to reflect flow quality.
        # Scoring Scale (0.0 to 1.0)
        - 1.0 (Coherent): Perfect logical flow. Arguments build upon each other.
        - 0.5 (Weak): Some disjointed sentences or abrupt transitions.
        - 0.0 (Incoherent): Random collection of unrelated sentences.
        Evaluate now. Return JSON.
      few_shot_examples: []

    relevance:
      prompt  : |
        Task: Evaluate **RELEVANCE**.
        Definition: Does the Candidate directly address the core topic/question of the Ground Truth?
        
        Ground Truth:
        {ground_truth}
        
        Candidate:
        {generated}
        
        # Scoring Scale (0.0 to 1.0)
        - 1.0 (Relevant): Directly and fully addresses the prompt/topic.
        - 0.5 (Tangential): Tangentially related; skirts the main issue.
        - 0.0 (Irrelevant): Completely off-topic.
        
        Instruction: Use the full range of the float scale (e.g. 0.9, 0.4) to reflect the degree of relevance.
        Evaluate now. Return JSON.
      few_shot_examples: []
