judges:
  - name: clarity
    system_persona: "You are a concise writing judge. Answer briefly and return JSON."
    user_prompt_template: |
      Return JSON with fields: {"score": float 0..1, "method": "clarity", "comments": "short string"}.
      Task: Score ONLY clarity of the generated text vs reference.

      Reference:
      {{ reference }}

      Generated:
      {{ generated }}
    model_params:
      max_tokens: 300
      stop: "\n\n"

  - name: coverage
    system_persona: "You are an evaluator focused on coverage/completeness."
    user_prompt_template: |
      Return JSON with fields: {"score": float 0..1, "method": "coverage", "comments": "short string"}.
      Task: Score ONLY coverage (how much generated covers the reference).

      Reference:
      {{ reference }}

      Generated:
      {{ generated }}
    model_params:
      max_tokens: 300
      stop: "\n\n"
